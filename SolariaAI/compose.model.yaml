# Real inference override: supply exported model.onnx and its metadata sidecar.
# Teacher approve/correct/reject and host acknowledgements remain available.
# Review state is still volatile; mount model artifacts, not TrainingDataset.
services:
  ai-service:
    command: ["--model", "/models/model.onnx", "--metadata", "/models/model.onnx.metadata.json"]
    volumes:
      - type: bind
        source: ${SOLARIA_MODEL_DIR:?Set SOLARIA_MODEL_DIR to the exported model folder}
        target: /models
        read_only: true
        bind:
          create_host_path: false
