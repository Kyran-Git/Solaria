# Synthetic API + teacher-console validation; no classroom ports/data.
# Full pytest and live smoke cover approve/correct/reject, identity-bound /ack,
# stale revision conflicts and acknowledgement resets. Not Minecraft travel tests.
services:
  ai-tests:
    build:
      context: .
      dockerfile: Dockerfile
    image: solaria-ai-tests:local
    init: true
    network_mode: none
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    stop_grace_period: 15s
