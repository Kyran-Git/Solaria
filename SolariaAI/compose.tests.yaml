# Synthetic API + teacher-console/review validation only; no classroom ports/data.
services:
  ai-tests:
    build:
      context: .
      dockerfile: Dockerfile
    image: solaria-ai-tests:local
    init: true
    network_mode: none
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    stop_grace_period: 15s
