
# One service serves both the inference/review API and teacher web console.
# Student capture stays in Minecraft. No training-dataset or review-data volumes:
# Reviews/thumbnails and revision-bound host acknowledgements are volatile
# (200 records, 2-hour expiry on access); restarting discards all pending reviews.
# Approve/correct/reject, host polling and /ack share port 8000 and the startup token.
# Keep one service instance: review state is in-process, not shared across replicas.
# ready means both approvals recorded, not planet generation or travel.
# Minecraft's LAN host calls this service; students do not need direct API access.
services:
  ai-service:
    labels:
      org.solaria.role: teacher-inference-review
    build:
      context: .
      dockerfile: Dockerfile.service
    image: solaria-ai-service:local
    init: true
    restart: unless-stopped
    environment:
      SOLARIA_STARTUP_TOKEN_FILE: /var/lib/solaria/startup-token.txt
    # Generated once, private to the service user; survives container replacement.
    # Host-bound so the token file is directly browsable at SolariaAI/.credentials/
    # instead of only reachable through `docker cp` on a Docker-managed volume.
    volumes:
      - ./.credentials:/var/lib/solaria
    ports:
      - "127.0.0.1:8000:8000"
    command: ["--mock"]
    read_only: true
    tmpfs:
      - /tmp:size=64m,mode=1777
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    stop_grace_period: 30s

# Credential only: reviews and drawings are never persisted here.
# The token lives on the host at SolariaAI/.credentials/startup-token.txt (bind
# mount above), not in a Docker-managed volume. Deleting that folder resets pairing.
