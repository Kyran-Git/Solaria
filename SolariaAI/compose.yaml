# One service serves both the inference/review API and teacher web console.
# Student capture stays in Minecraft. No training-dataset or review-data volumes:
# reviews/thumbnails are volatile (200 records, 2-hour expiry on access).
services:
  ai-service:
    labels:
      org.solaria.role: teacher-inference-review
    build:
      context: .
      dockerfile: Dockerfile.service
    image: solaria-ai-service:local
    init: true
    restart: unless-stopped
    environment:
      SOLARIA_STARTUP_TOKEN: ${SOLARIA_STARTUP_TOKEN:?Set SOLARIA_STARTUP_TOKEN before starting the AI service}
    ports:
      - "127.0.0.1:8000:8000"
    command: ["--mock"]
    read_only: true
    tmpfs:
      - /tmp:size=64m,mode=1777
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    stop_grace_period: 30s
