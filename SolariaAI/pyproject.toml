[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "solaria-image-classifier"
version = "0.1.0"
description = "Reproducible sketch-friendly CNN image classifier"
requires-python = ">=3.10"
dependencies = [
  "torch>=2.1",
  "torchvision>=0.16",
  "numpy>=1.24",
  "Pillow>=9.5",
  "pyyaml>=6.0",
]

[project.optional-dependencies]
export = ["onnx>=1.14", "onnxruntime>=1.16", "onnxscript>=0.1"]
dev = ["pytest>=7.4", "ruff>=0.5", "jsonschema>=4.21"]
vision = ["opencv-python-headless>=4.8"]

[project.scripts]
solaria-classifier = "solaria_classifier.cli:main"
solaria-clean = "solaria_vision.cli:main"

[tool.setuptools.packages.find]
include = ["solaria_classifier*", "solaria_vision*", "solaria_pipeline*"]

[tool.ruff]
line-length = 100
target-version = "py310"
