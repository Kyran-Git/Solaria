plugins {
	id 'net.fabricmc.fabric-loom' version "${loom_version}"
	id 'maven-publish'
}

repositories {
	// Add repositories to retrieve artifacts from in here.
	// You should only use this when depending on other mods because
	// Loom adds the essential maven repositories to download Minecraft and libraries from automatically.
	// See https://docs.gradle.org/current/userguide/declaring_repositories.html
	// for more information about repositories.

	// Oracle Index (in-game wiki viewer) is published on Modrinth.
	exclusiveContent {
		forRepository {
			maven {
				name = "Modrinth"
				url = "https://api.modrinth.com/maven"
			}
		}
		filter {
			includeGroup "maven.modrinth"
		}
	}

	// Architectury API, required by Oracle Index.
	maven {
		name = "Architectury"
		url = "https://maven.architectury.dev/"
	}
}

loom {
	splitEnvironmentSourceSets()
	mods {
		solariamod {
			sourceSet sourceSets.main
			sourceSet sourceSets.client
		}
	}
	runs {
		// Client entrypoint lives in the client source set; without this the IDE run
		// uses solariamod.main and Knot throws ClassNotFoundException for SolariaClient.
		client {
			source sourceSets.client
		}
	}
}

fabricApi {
	configureDataGeneration {
		client = true
	}
}

dependencies {
	// To change the versions see the gradle.properties file
	minecraft "com.mojang:minecraft:${project.minecraft_version}"
	implementation "net.fabricmc:fabric-loader:${project.loader_version}"

	// Fabric API. This is technically optional, but you probably want it anyway.
	implementation "net.fabricmc.fabric-api:fabric-api:${project.fabric_api_version}"

	// Oracle Index: client-side documentation viewer, used to show the Solaria wiki in game.
	implementation "maven.modrinth:oracle-index:${project.oracle_index_version}"

	// Architectury API is a required dependency of Oracle Index.
	implementation "dev.architectury:architectury-fabric:${project.architectury_version}"
}

// Mirror the wiki source into the book folder Oracle Index reads at runtime.
// Sync (not Copy) also deletes renamed/removed pages, so the in-game wiki cannot
// keep serving a stale page that no longer exists in wiki/.
tasks.register('syncWiki', Sync) {
	from 'wiki'
	into 'src/main/resources/assets/oracle_index/books/solariamod'
}

tasks.withType(AbstractCopyTask).configureEach { task ->
	if (task.name != 'syncWiki') {
		mustRunAfter syncWiki
	}
}

processResources {
	dependsOn syncWiki

	def version = project.version
	inputs.property "version", version

	filesMatching("fabric.mod.json") {
		expand "version": version
	}
}

tasks.withType(JavaCompile).configureEach {
	it.options.release = 25
}

// Dependency-free unit tests: failures throw AssertionError and fail test/build.
tasks.register('foundationTest', JavaExec) {
	group = 'verification'
	description = 'Runs M1 plumbing checks (synthetic), without a new test library.'
	dependsOn testClasses
	classpath = sourceSets.test.runtimeClasspath
	mainClass = 'net.kyrangit.solaria.FoundationTests'
	javaLauncher = javaToolchains.launcherFor {
		languageVersion = JavaLanguageVersion.of(25)
	}
}

// Wiki structure checks: mirrors the Oracle Index navigation rules, so a page that
// is missing from _meta.json (or listed without its .mdx suffix) fails the build
// instead of silently disappearing from the in-game sidebar.
tasks.register('wikiStructureTest', JavaExec) {
	group = 'verification'
	description = 'Validates the Oracle Index book structure (synthetic).'
	dependsOn syncWiki, testClasses
	classpath = sourceSets.test.runtimeClasspath
	mainClass = 'net.kyrangit.solaria.WikiStructureTests'
	javaLauncher = javaToolchains.launcherFor {
		languageVersion = JavaLanguageVersion.of(25)
	}
}

// M2 blueprint checks: ten-class contract, deterministic generators, size-cap /
// scale enforcement, no forbidden blocks. Pure plumbing check (synthetic).
tasks.register('blueprintTest', JavaExec) {
	group = 'verification'
	description = 'Validates the M2 blueprints and voxel generators (synthetic).'
	dependsOn testClasses
	classpath = sourceSets.test.runtimeClasspath
	mainClass = 'net.kyrangit.solaria.BlueprintTests'
	javaLauncher = javaToolchains.launcherFor {
		languageVersion = JavaLanguageVersion.of(25)
	}
}

// Manual-only preview task: renders PNG slices under build/previews/ for human review.
// Not wired into `test` to keep CI/build cheap; run with `gradlew blueprintPreview`.
tasks.register('blueprintPreview', JavaExec) {
	group = 'verification'
	description = 'Writes PNG slice previews of every blueprint to build/previews/.'
	dependsOn testClasses
	classpath = sourceSets.test.runtimeClasspath
	mainClass = 'net.kyrangit.solaria.BlueprintPreview'
	// Headless so the task works on CI machines without a display.
	systemProperty 'java.awt.headless', 'true'
	javaLauncher = javaToolchains.launcherFor {
		languageVersion = JavaLanguageVersion.of(25)
	}
}

tasks.named('test') {
	dependsOn foundationTest, wikiStructureTest, blueprintTest
	// Tests use a Java main runner rather than a JUnit engine.
	exclude '**/*'
}

java {
	// Loom will automatically attach sourcesJar to a RemapSourcesJar task and to the "build" task
	// if it is present.
	// If you remove this line, sources will not be generated.
	withSourcesJar()

	// Minecraft 1.21.9+ / 26.x requires Java 25. Using a toolchain means compilation and
	// runClient/runServer always use a Java 25 JDK, even when Gradle itself runs on another JDK.
	toolchain {
		languageVersion = JavaLanguageVersion.of(25)
	}
}

jar {
	def projectName = project.name
	inputs.property "projectName", projectName

	from("LICENSE") {
		rename { "${it}_$projectName"}
	}
}

// configure the maven publication
publishing {
	publications {
		create("mavenJava", MavenPublication) {
			from components.java
		}
	}

	// See https://docs.gradle.org/current/userguide/publishing_maven.html for information on how to set up publishing.
	repositories {
		// Add repositories to publish to here.
		// Notice: This block does NOT have the same function as the block in the top level.
		// The repositories here will be used for publishing your artifact, not for
		// retrieving dependencies.
	}
}
